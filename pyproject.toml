[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rove-eval"
version = "0.1.0"
description = "Robot Observation & Vision Evaluation — agent pipeline evaluation for robotics VLM/VLA/LLM systems"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
azure = [
    "azure-ai-projects>=2.0.0b3",
    "azure-identity>=1.19.0",
    "openai>=1.0.0",
    "aiohttp>=3.9.0",
    "tenacity>=8.0",
]
smolvla = ["lerobot", "transformers", "num2words"]
dev = ["pytest", "pytest-asyncio", "httpx", "pre-commit", "bandit[toml]"]
data = ["datasets>=3.0", "huggingface-hub>=0.25", "Pillow>=10.0"]

[project.scripts]
rove = "rove.ui.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rove"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B311"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["rove"]
