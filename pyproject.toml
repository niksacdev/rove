[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rove-eval"
version = "0.1.0"
description = "Robot Observation & Vision Evaluation — agent pipeline evaluation for robotics VLM/VLA/LLM systems"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.34.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.32",
    "httpx>=0.27.0",
    "plotly>=6.3,<7",
]

[project.optional-dependencies]
copilot = ["github-copilot-sdk[telemetry]==1.0.13", "opentelemetry-sdk==1.44.0"]
azure = [
    "azure-ai-projects>=2.0.0b3",
    "azure-identity>=1.19.0",
    "openai>=1.0.0",
    "aiohttp>=3.14.3",
    "tenacity>=8.0",
]
# LeRobot 0.6+ requires Python 3.12; do not resolve the vulnerable legacy stack.
smolvla = [
    "lerobot>=0.6.1; python_version >= '3.12'",
    "transformers>=5.10.0; python_version >= '3.12'",
    "num2words; python_version >= '3.12'",
]
kinematics = ["mujoco>=3.0"]
dev = ["pytest", "pytest-asyncio", "httpx", "pre-commit", "bandit[toml]"]
data = ["datasets>=5.0.1", "huggingface-hub>=0.25", "Pillow>=12.3.0"]

[project.scripts]
rove = "rove.ui.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rove"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B311"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["rove"]
