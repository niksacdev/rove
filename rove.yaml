# rove.yaml — single source of truth for endpoints AND evaluations
# Updated 2026-02-22 — flat endpoint structure with Pydantic validation
version: "1.0"

# =============================================================================
# Endpoints — Atomic model/environment configurations (one per entry)
# =============================================================================
# Each endpoint maps to one adapter class. URLs go here; only auth secrets
# stay as env var references (api_key_env).

endpoints:
  # --- Cloud VLMs ---
  gpt-4o:
    type: vlm
    adapter: azure_openai
    display_name: "GPT-4o"
    deployment_type: azure_managed
    endpoint: "https://your-resource.openai.azure.com/"
    config:
      auth_mode: default_credential
      api_key_env: AZURE_OPENAI_KEY
      deployment_name: gpt-4o
      api_version: "2025-04-01-preview"
    capabilities: [scene_analysis, task_planning, verification]
    cost: { type: per_token, input_per_1k: 0.005, output_per_1k: 0.015 }
    notes: "Most reliable structured JSON output via response_format. Gold standard cloud VLM."

  # --- Open-weight VLMs (local + cloud) ---
  qwen3-vl-8b:
    type: vlm
    adapter: lmstudio
    display_name: "Qwen3-VL 8B (LM Studio)"
    deployment_type: local
    endpoint: "http://127.0.0.1:1234"
    config:
      model_id: "qwen/qwen3-vl-8b"
      max_tokens: 2048
      context_length: 4096
      temperature: 0.1
      api_key_env: LM_API_TOKEN
    capabilities: [scene_analysis, native_grounding, task_planning, verification, 3d_grounding]
    cost: { type: fixed, per_call: 0.00 }
    max_concurrent: 1
    availability:
      huggingface: "Qwen/Qwen3-VL-8B-Instruct"
      lmstudio: true
      unsloth: true
      ollama: true
    notes: >
      Qwen3-VL 8B running locally via LM Studio at http://127.0.0.1:1234.
      Superior spatial perception, 3D grounding for embodied AI.

  qwen3-vl-2b:
    type: vlm
    adapter: local_transformers
    display_name: "Qwen3-VL 2B"
    deployment_type: local
    config:
      model_id: "Qwen/Qwen3-VL-2B-Instruct"
      device: mps
      max_tokens: 1024
      quantization: fp16
    capabilities: [scene_analysis, native_grounding, verification]
    cost: { type: fixed, per_call: 0.00 }
    max_concurrent: 1
    availability:
      huggingface: "Qwen/Qwen3-VL-2B-Instruct"
      lmstudio: true
      unsloth: true
      ollama: true
    notes: "Edge-deployable VLM. Good for latency-sensitive robotics. Limited grasp planning quality."

  phi-4-multimodal:
    type: vlm
    adapter: foundry_local
    display_name: "Phi-4 Multimodal"
    deployment_type: local
    config:
      model_id: "microsoft/phi-4-multimodal"
      device: auto
      max_tokens: 1024
    capabilities: [scene_analysis, verification]
    cost: { type: fixed, per_call: 0.00 }
    max_concurrent: 1
    availability:
      azure_foundry: true
      foundry_local: true
      huggingface: "microsoft/phi-4-multimodal"
      lmstudio: true
      unsloth: true
    notes: >
      Microsoft's multimodal SLM. Vision+speech+language in one model.
      Fits in 8GB VRAM. Ideal for edge/on-device robotics evaluation.

  ministral-3-3b:
    type: vlm
    adapter: local_transformers
    display_name: "Ministral 3 3B"
    deployment_type: local
    config:
      model_id: "mistralai/Ministral-3-3B-Instruct-2512"
      device: mps
      max_tokens: 1024
      quantization: fp16
    capabilities: [scene_analysis, verification]
    cost: { type: fixed, per_call: 0.00 }
    max_concurrent: 1
    availability:
      huggingface: "mistralai/Ministral-3-3B-Instruct-2512"
      azure_foundry: true
      lmstudio: true
      ollama: true
    notes: >
      Mistral's tiny multimodal model (vision+text). Apache 2.0 license.
      256K context window. Fits in <8GB VRAM quantized. Good for quick perception checks.

  # --- Azure AI Foundry VLMs (demo) ---
  qwen25-vl-7b:
    type: vlm
    adapter: azure_foundry
    display_name: "Qwen2.5-VL 7B (Azure)"
    deployment_type: azure_serverless
    endpoint: "https://your-foundry-endpoint.inference.ai.azure.com/"
    config:
      auth_mode: default_credential
      api_key_env: AZURE_AI_FOUNDRY_KEY
      model_name: "Qwen2.5-VL-7B-Instruct"
    capabilities: [scene_analysis, task_planning, verification]
    cost: { type: per_token, input_per_1k: 0.0003, output_per_1k: 0.001 }
    notes: "Qwen2.5-VL-7B-Instruct on Azure AI Foundry. Primary demo VLM."

  phi-4-multimodal-azure:
    type: vlm
    adapter: azure_foundry
    display_name: "Phi-4 Multimodal (Azure)"
    deployment_type: azure_serverless
    endpoint: "https://your-foundry-endpoint.inference.ai.azure.com/"
    config:
      auth_mode: default_credential
      api_key_env: AZURE_AI_FOUNDRY_KEY
      model_name: "Phi-4-multimodal-instruct"
    capabilities: [scene_analysis, verification]
    cost: { type: per_token, input_per_1k: 0.0002, output_per_1k: 0.0008 }
    notes: "Phi-4 Multimodal on Azure AI Foundry. Comparison VLM for demo."

  # --- Mock VLM (Phase 1 testing) ---
  mock-vlm:
    type: vlm
    adapter: mock_vlm
    display_name: "Mock VLM"
    deployment_type: local
    config:
      mock_quality: 0.85
      mock_latency_ms: [200, 500]
    capabilities: [scene_analysis, task_planning, verification]

  # --- VLAs ---
  pi0:
    type: vla
    adapter: local_openpi
    display_name: "π0 (Pi-Zero)"
    deployment_type: local
    config:
      model_id: "physical-intelligence/pi0-base"
      framework: jax
      action_space: ee_delta
      chunk_size: 10
      requires_proprio: true
    cost: { type: fixed, per_call: 0.00 }
    max_concurrent: 1
    availability:
      huggingface: true
      github: "Physical-Intelligence/openpi"
    notes: >
      Most advanced open-source VLA. Flow-matching architecture using PaliGemma backbone.
      ~50 Hz inference. Best zero-shot performance on long-horizon tasks.
      Supports ALOHA and DROID platforms. π0.5 available with open-world generalization.

  pi0-fast:
    type: vla
    adapter: local_openpi
    display_name: "π0-FAST"
    deployment_type: local
    config:
      model_id: "physical-intelligence/pi0-fast-base"
      framework: jax
      action_space: ee_delta
      chunk_size: 10
      requires_proprio: true
      tokenizer: fast
    cost: { type: fixed, per_call: 0.00 }
    max_concurrent: 1
    availability:
      huggingface: true
      github: "Physical-Intelligence/openpi"
    notes: >
      FAST tokenizer variant of π0. Better language following but ~4-5x higher inference cost.
      Use when instruction-following accuracy matters more than speed.

  openvla-oft-7b:
    type: vla
    adapter: local_openvla
    display_name: "OpenVLA-OFT 7B"
    deployment_type: local
    config:
      model_id: "openvla/openvla-7b-finetuned-libero-spatial"
      device: mps
      quantization: mlx
      action_space: ee_delta
      chunk_size: 1
      requires_proprio: false
    cost: { type: fixed, per_call: 0.00 }
    max_concurrent: 1
    availability:
      huggingface: "openvla/openvla-7b"
      unsloth: true
    notes: >
      Most popular open-source VLA. Autoregressive architecture (256 bins/dim).
      Has per-token logprobs for principled confidence. ~5-15 Hz inference.
      IMPORTANT: MLX quantization required on Apple Silicon (no bitsandbytes MPS support).

  smolvla-450m:
    type: vla
    adapter: local_lerobot
    display_name: "SmolVLA 450M"
    deployment_type: local
    config:
      model_id: "HuggingFaceTB/SmolVLA-base"
      device: mps
      action_space: ee_delta
      chunk_size: 10
      requires_proprio: true
    cost: { type: fixed, per_call: 0.00 }
    max_concurrent: 1
    availability:
      huggingface: "HuggingFaceTB/SmolVLA-base"
      lerobot: true
    notes: >
      Tiny VLA achieving comparable performance to 7B+ models.
      Flow matching with SmolVLM backbone. Ideal for edge deployment.
      Requires proprioception (current joint state) as input.

  cogact-7b:
    type: vla
    adapter: local_cogact
    display_name: "CogACT 7B"
    deployment_type: local
    config:
      model_id: "CogACT/CogACT-Base"
      device: cuda
      denoising_steps: 10
      action_space: ee_delta
      chunk_size: 16
    cost: { type: fixed, per_call: 0.00 }
    max_concurrent: 1
    availability:
      huggingface: "CogACT/CogACT-Base"
    notes: >
      Microsoft Research VLA. Diffusion-based action prediction.
      MIT license. Inference latency 2-10s due to diffusion denoising.
      Available in Small/Base/Large variants.

  octo-base:
    type: vla
    adapter: local_octo
    display_name: "Octo-Base 93M"
    deployment_type: local
    config:
      model_id: "rail-berkeley/octo-base-1.5"
      device: cuda
      action_space: ee_delta
      chunk_size: 4
      requires_proprio: true
    cost: { type: fixed, per_call: 0.00 }
    max_concurrent: 1
    availability:
      huggingface: "rail-berkeley/octo-base-1.5"
      github: "octo-models/octo"
    notes: >
      UC Berkeley's lightweight generalist robot policy (93M params).
      Transformer-based diffusion policy trained on 800K episodes (Open X-Embodiment).
      ~13 it/sec on NVIDIA 4090. Good for contact-rich tasks like assembly.

  # --- Mock VLA (Phase 1 testing) ---
  mock-vla:
    type: vla
    adapter: mock_vla
    display_name: "Mock VLA"
    deployment_type: local
    config:
      mock_success_rate: 0.80
      mock_latency_ms: [50, 150]

  # --- LLMs for task planning ---
  qwen3-8b:
    type: llm
    adapter: local_transformers
    display_name: "Qwen3 8B"
    deployment_type: local
    config:
      model_id: "Qwen/Qwen3-8B"
      device: mps
      max_tokens: 2048
    cost: { type: fixed, per_call: 0.00 }
    availability:
      huggingface: "Qwen/Qwen3-8B"
      lmstudio: true
      unsloth: true
      ollama: true
      foundry_local: true
    notes: >
      Leading open-source LLM for agent/planning tasks. Strong tool-use and
      structured output capabilities. Good for task decomposition in robotics.

  phi-4-mini:
    type: llm
    adapter: foundry_local
    display_name: "Phi-4 Mini 3.8B"
    deployment_type: local
    config:
      model_id: "microsoft/phi-4-mini"
      device: auto
      max_tokens: 1024
    cost: { type: fixed, per_call: 0.00 }
    availability:
      azure_foundry: true
      foundry_local: true
      huggingface: "microsoft/phi-4-mini"
      lmstudio: true
      ollama: true
    notes: >
      Microsoft's edge LLM. Runs entirely on-device via Foundry Local.
      Ideal for offline robotics planning where cloud is unavailable.

  # --- Grounding ---
  groundingdino:
    type: grounding
    adapter: local_groundingdino
    display_name: "GroundingDINO"
    deployment_type: local
    config: { device: mps, prefer_device: cpu }
    availability:
      huggingface: "IDEA-Research/grounding-dino-base"

  mock-grounding:
    type: grounding
    adapter: mock_grounding
    display_name: "Mock Grounding"
    deployment_type: local

  # --- Agents ---
  mock-agent:
    type: agent
    adapter: mock_agent
    display_name: "Mock Agent"
    deployment_type: local
    capabilities: [scene_analysis, task_planning, verification, action_execution]
    config:
      mock_latency_ms: [300, 800]
    # Uncomment when Foundry agent is configured:
    # foundry-task-agent:
    #   type: agent
    #   adapter: azure_foundry_agent
    #   display_name: "Foundry Task Agent"
    #   deployment_type: azure_managed
    #   endpoint: "https://your-foundry-agent-endpoint.azure.com/"
    #   capabilities: [task_planning, action_execution]
    #   config:
    #     agent_id: "my-robotics-agent"

  # --- Simulation environments ---
  mujoco-libero:
    type: sim
    adapter: local_mujoco
    display_name: "MuJoCo + LIBERO"
    deployment_type: local
    config:
      task_suite: libero_spatial
      render_size: [640, 480]

  mock-sim:
    type: sim
    adapter: mock_sim
    display_name: "Mock Sim"
    deployment_type: local

# =============================================================================
# Strategies — Named pipeline configurations (map endpoints to stages)
# =============================================================================

strategies:
  # --- Testing ---
  mock:
    display_name: "Mock (Test)"
    description: "All mock adapters — for testing pipeline plumbing without real models"
    perceive: mock-vlm
    plan: mock-vlm
    act: mock-vla
    verify: mock-vlm
    sim: mock-sim
    tags: [test, mock]

  # --- Scene Detection ---
  # Select multiple scene_detect_* strategies together to compare VLM perception
  # in parallel via RunManager (e.g. "Which VLM finds more objects?")
  scene_detect_gpt4o:
    display_name: "Scene Detection (GPT-4o)"
    description: "GPT-4o perceives the scene and verifies — no planning or action"
    perceive: gpt-4o
    verify: gpt-4o
    sim: mock-sim
    tags: [scene, vlm, cloud]

  scene_detect_qwen:
    display_name: "Scene Detection (Qwen3-VL 8B)"
    description: "Qwen3-VL 8B perceives the scene locally via LM Studio"
    perceive: qwen3-vl-8b
    verify: qwen3-vl-8b
    sim: mock-sim
    tags: [scene, vlm, local]

  scene_detect_phi4:
    display_name: "Scene Detection (Phi-4)"
    description: "Phi-4 Multimodal perceives the scene — smallest cloud VLM"
    perceive: phi-4-multimodal-azure
    verify: phi-4-multimodal-azure
    sim: mock-sim
    tags: [scene, vlm, cloud]

  # --- Full Pipeline (perceive → plan → act → verify) ---
  scene_plan_act:
    display_name: "Full Pipeline (GPT-4o + π0)"
    description: "GPT-4o perceives and plans, π0-FAST executes actions, GPT-4o verifies"
    perceive: gpt-4o
    plan: gpt-4o
    act: pi0-fast
    verify: gpt-4o
    sim: mujoco-libero
    tags: [full, cloud, vla]

  scene_plan_act_local:
    display_name: "Full Pipeline (Qwen + SmolVLA)"
    description: "Qwen3-VL 8B perceives and plans locally, SmolVLA executes, Qwen verifies"
    perceive: qwen3-vl-8b
    plan: qwen3-vl-8b
    act: smolvla-450m
    verify: qwen3-vl-8b
    sim: mujoco-libero
    tags: [full, local, vla]

  # --- End-to-End VLA ---
  # VLA handles act directly from image+task (no separate perceive/plan stage).
  # VLM only used for independent verification.
  e2e_vla_pi0:
    display_name: "E2E VLA (π0-FAST)"
    description: "π0-FAST acts directly from image — VLM only verifies the result"
    act: pi0-fast
    verify: gpt-4o
    sim: mujoco-libero
    tags: [e2e, vla, cloud]

  e2e_vla_smolvla:
    display_name: "E2E VLA (SmolVLA)"
    description: "SmolVLA acts directly from image — smallest VLA, edge-deployable"
    act: smolvla-450m
    verify: qwen3-vl-2b
    sim: mujoco-libero
    tags: [e2e, vla, edge]

  e2e_vla_openvla:
    display_name: "E2E VLA (OpenVLA-OFT)"
    description: "OpenVLA-OFT acts directly — autoregressive VLA with confidence scores"
    act: openvla-oft-7b
    verify: qwen3-vl-8b
    sim: mujoco-libero
    tags: [e2e, vla, local]

  # --- Edge / Offline ---
  # All models run on-device, no cloud dependency
  e2e_edge:
    display_name: "Edge (All Local)"
    description: "Qwen3-VL 2B + SmolVLA — fully offline, runs on Apple Silicon"
    perceive: qwen3-vl-2b
    plan: qwen3-vl-2b
    act: smolvla-450m
    verify: qwen3-vl-2b
    sim: mujoco-libero
    tags: [edge, local, offline]

  e2e_edge_phi4:
    display_name: "Edge (Phi-4 + SmolVLA)"
    description: "Phi-4 Multimodal for perception + SmolVLA for action — all on-device"
    perceive: phi-4-multimodal
    plan: phi-4-multimodal
    act: smolvla-450m
    verify: phi-4-multimodal
    sim: mujoco-libero
    tags: [edge, local, offline]

  # --- Agent-Orchestrated ---
  # Agent adapter handles multiple stages via tool calls (plan + act)
  agent_orchestrated:
    display_name: "Agent Orchestrated"
    description: "Agent plans and acts via tool calls — VLM perceives and verifies"
    perceive: mock-vlm
    plan: mock-agent
    act: mock-agent
    verify: mock-vlm
    sim: mock-sim
    tags: [agent, tool-use]

# =============================================================================
# Defaults — Global settings
# =============================================================================
defaults:
  grounding: mock-grounding
  sim: mock-sim
  trials: 1
  mode: full                              # full | vlm_only
  max_concurrent_combinations: 9
  timeout_per_step_ms: 30000
  max_retries_per_step: 2
