# Merge this fragment into your existing rove.yaml. It is not a complete strategy config.
# Start the explicitly selected local collector, then opt in by changing enabled to true.
defaults:
  observability:
    enabled: false
    endpoint: http://127.0.0.1:4318
    request_timeout_s: 1
    shutdown_timeout_s: 0.1
    queue_capacity: 64
    max_payload_bytes: 1000000
