name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - name: Install frozen development and physics dependencies
        run: uv sync --frozen --extra dev --extra data --extra kinematics
      - name: Static checks
        run: |
          uvx ruff==0.16.7 check src tests scripts
          uv run --frozen python -m compileall -q src
          uv run --frozen bandit -q -r src -c pyproject.toml
          node --check frontend/app.js
      - name: Regression tests and mock report
        run: |
          uv run --frozen pytest -q
          uv run --frozen python scripts/demo.py --output data/output/ci-demo.json
      - name: Dependency audit
        run: |
          uv export --frozen --extra dev --extra data --extra kinematics --no-emit-project --no-hashes --output-file /tmp/rove-requirements.txt
          uvx pip-audit==2.10.1 -r /tmp/rove-requirements.txt --no-deps --disable-pip
      - name: Scan release tree for secrets
        run: |
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact=100 --no-banner
